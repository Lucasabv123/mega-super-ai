<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Super Mega AI</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    h1 { position: absolute; top: 10px; left: 40px; margin: 0; }
    #newChat { position: absolute; top: 56px; left: 40px; }
    #memoryBox { position: absolute; top:400px; left: 40px; width: 220px; }
    #oldChats { position: absolute; top: 90px; left: 40px; max-width: 220px; }
    #usageBox { position: absolute; top: 90px; right: 40px; width: 220px; }
    #claudeUsage { margin-top: 16px; }
    #messages div { padding: 8px 12px; margin: 6px 0; border-radius: 8px; white-space: pre-wrap; }
    .you { background: #e8f0fe; }
    .ai { background: #f1f1f1; }
    form { display: flex; gap: 8px; position: fixed; bottom: 20px; left: 0; right: 0; max-width: 668px; margin: 0 auto; }
    input { flex: 1; padding: 8px; }
  </style>
</head>
<body>
  <h1>Mega Super AI</h1>
  <button type="button" id="newChat">New chat</button>
  <select id="oldChats"></select>
  <div id="memoryBox">
  <b>Memory</b>
  <ul id="memoryList"></ul>
  <input id="memoryInput" placeholder="Add a fact..." autocomplete="off">
  <button type="button" id="addMemory">Add</button>
  </div>
  <div id="usageBox">
    <b>ChatGPT usage</b>
    <div>5-hour: <span id="fiveHourText">no reading yet</span></div>
    <progress id="fiveHourBar" max="100" value="0"></progress>
    <div>Week: <span id="weeklyText">no reading yet</span></div>
    <progress id="weeklyBar" max="100" value="0"></progress>
    <input id="fiveHourLeft" placeholder="5-hour % left" autocomplete="off">
    <input id="fiveHourResets" placeholder="5-hour reset time" autocomplete="off">
    <input id="weeklyLeft" placeholder="Week % left" autocomplete="off">
    <input id="weeklyResets" placeholder="Week reset time" autocomplete="off">
    <button type="button" id="saveReading">Save reading</button>
    <div id="claudeUsage">
      <b>Claude usage</b>
      <div>Session: <span id="claudeSessionText">loading...</span></div>
      <progress id="claudeSessionBar" max="100" value="0"></progress>
      <div>Week: <span id="claudeWeekText">loading...</span></div>
      <progress id="claudeWeekBar" max="100" value="0"></progress>
    </div>
  </div>
  <div id="messages"></div>
  <form id="form">
    <select id="provider">
      <option value="chatgpt">ChatGPT</option>
      <option value="claude">Claude</option>
    </select>
    <input id="message" placeholder="Type a message..." autocomplete="off">
    <button>Send</button>
  </form>

  <script>
    const messages = document.getElementById("messages");

    // Adds one chat bubble to the page.
    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = who;
      div.textContent = text; // textContent, so AI text can't run code on your page
      messages.appendChild(div);
    }

    let chatId = null; // which chat we're in (null = start a new one)
    const oldChats = document.getElementById("oldChats");
    // New chat: forget the current chat and clear the screen.
    document.getElementById("newChat").addEventListener("click", () => {
      chatId = null;
      messages.innerHTML = ""; 
      oldChats.value = "";
    });

    // Fill the dropdown with all saved chats.
    async function loadChatList() {
      const response = await fetch("/chats");
      const chats = await response.json();
      oldChats.innerHTML = "";
      for (const chat of chats) {
        const option = document.createElement("option");
        option.value = chat.id;
        option.textContent = chat.title.slice(0, 40); // first 40 letters
        oldChats.appendChild(option);
      }
      oldChats.value = chatId ?? ""; // show which chat is open
    }

    // Picking a chat in the dropdown opens it.
    oldChats.addEventListener("change", async () => {
      const response = await fetch("/chat/open?id=" + oldChats.value);
      const data = await response.json();
      chatId = data.chatId;
      messages.innerHTML = "";
      for (const m of data.messages) addBubble(m.content, m.role === "user" ? "you" : "ai");
    });

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault(); // stop the page from reloading
      const provider = document.getElementById("provider").value;
      const input = document.getElementById("message");
      const message = input.value;
      if (!message) return;
      addBubble(message, "you");
      input.value = "";

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        
        body: JSON.stringify({ chatId: chatId, provider: provider, message: message }),
      });
      const data = await response.json();
      if (data.chatId) chatId = data.chatId;
      loadChatList();
      addBubble(data.reply ?? data.error, "ai");
      loadUsageBar(); // update the bars after each answer
      loadClaudeUsage();
    });
        // When the page opens, show the newest chat from the database.
    async function loadLatest() {
      const response = await fetch("/chat/latest");
      const data = await response.json();
      chatId = data.chatId;
      for (const m of data.messages) addBubble(m.content, m.role === "user" ? "you" : "ai");
      loadChatList();
    }
    loadLatest();
    const memoryList = document.getElementById("memoryList");

// Show all saved facts, each with an x button to delete it.
async function loadMemories() {
  const response = await fetch("/memories");
  const memories = await response.json();
  memoryList.innerHTML = "";
  for (const memory of memories) {
    const li = document.createElement("li");
    li.textContent = memory.content + " ";
    const del = document.createElement("button");
    del.textContent = "x";
    del.addEventListener("click", async () => {
      await fetch("/memories/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: memory.id }),
      });
      loadMemories(); // show the list again without it
    });
    li.appendChild(del);
    memoryList.appendChild(li);
  }
}

// Add button: save the new fact, then show the list again.
document.getElementById("addMemory").addEventListener("click", async () => {
  const input = document.getElementById("memoryInput");
  if (!input.value) return;
  await fetch("/memories", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: input.value }),
  });
  input.value = "";
  loadMemories();
});
loadMemories();
// Show the estimated % left on the two bars.
async function loadUsageBar() {
  const response = await fetch("/usage/bar");
  const bar = await response.json();
  if (!bar) return; // no reading saved yet
  document.getElementById("fiveHourBar").value = bar.fiveHour.left;
  document.getElementById("fiveHourText").textContent = bar.fiveHour.left + "% left, resets " + bar.fiveHour.resets;
  document.getElementById("weeklyBar").value = bar.weekly.left;
  document.getElementById("weeklyText").textContent = bar.weekly.left + "% left, resets " + bar.weekly.resets;
}

// Save reading button: send the 4 boxes to /reading, then show the bars again.
document.getElementById("saveReading").addEventListener("click", async () => {
  // Don't save if any box is empty.
  for (const id of ["fiveHourLeft", "fiveHourResets", "weeklyLeft", "weeklyResets"]) {
    if (!document.getElementById(id).value) return;
  }
  await fetch("/reading", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      fiveHourLeft: Number(document.getElementById("fiveHourLeft").value), // Number turns the text "70" into the number 70
      fiveHourResets: document.getElementById("fiveHourResets").value,
      weeklyLeft: Number(document.getElementById("weeklyLeft").value),
      weeklyResets: document.getElementById("weeklyResets").value,
    }),
  });
  loadUsageBar();
});

loadUsageBar();

// Show your real Claude plan usage on the two Claude bars.
async function loadClaudeUsage() {
  const response = await fetch("/usage/claude");
  const usage = await response.json();
  if (usage.session) {
    document.getElementById("claudeSessionBar").value = usage.session.left;
    document.getElementById("claudeSessionText").textContent = usage.session.left + "% left, resets " + usage.session.resets;
  }
  if (usage.week) {
    document.getElementById("claudeWeekBar").value = usage.week.left;
    document.getElementById("claudeWeekText").textContent = usage.week.left + "% left, resets " + usage.week.resets;
  }
}
loadClaudeUsage();
  </script>
</body>
</html>
