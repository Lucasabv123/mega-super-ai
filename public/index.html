<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Super Mega AI</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    h1 { position: absolute; top: 10px; left: 40px; margin: 0; }
    #messages div { padding: 8px 12px; margin: 6px 0; border-radius: 8px; white-space: pre-wrap; }
    .you { background: #e8f0fe; }
    .ai { background: #f1f1f1; }
    form { display: flex; gap: 8px; position: fixed; bottom: 20px; left: 0; right: 0; max-width: 668px; margin: 0 auto; }
    input { flex: 1; padding: 8px; }
  </style>
</head>
<body>
  <h1>Mega Super AI</h1>
  <div id="messages"></div>
  <form id="form">
    <select id="provider">
      <option value="chatgpt">ChatGPT</option>
      <option value="claude">Claude</option>
    </select>
    <input id="message" placeholder="Type a message..." autocomplete="off">
    <button>Send</button>
  </form>

  <script>
    const messages = document.getElementById("messages");

    // Adds one chat bubble to the page.
    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = who;
      div.textContent = text; // textContent, so AI text can't run code on your page
      messages.appendChild(div);
    }

    let chatId = null; // which chat we're in (null = start a new one)

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault(); // stop the page from reloading
      const provider = document.getElementById("provider").value;
      const input = document.getElementById("message");
      const message = input.value;
      if (!message) return;
      addBubble(message, "you");
      input.value = "";

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        
        body: JSON.stringify({ chatId: chatId, provider: provider, message: message }),
      });
      const data = await response.json();
      if (data.chatId) chatId = data.chatId;
      addBubble(data.reply ?? data.error, "ai");
    });
        // When the page opens, show the newest chat from the database.
    async function loadLatest() {
      const response = await fetch("/chat/latest");
      const data = await response.json();
      chatId = data.chatId;
      for (const m of data.messages) addBubble(m.content, m.role === "user" ? "you" : "ai");
    }
    loadLatest();
  </script>
</body>
</html>
